    <section class="rsvp-section" id="rsvp" aria-labelledby="rsvp-title">
        <div class="rsvp-card">

                <div class="form-field">
                    <label for="guest-name">Твоё имя</label>

                </div>

                    <legend>Получится прийти?</legend>
                    <label class="choice-card">
                        <input type="radio" name="attendance" value="yes" required>
                        <span class="choice-icon" aria-hidden="true">♡</span>
                        <span>Да, с радостью!</span>

                    <label class="choice-card">
                        <input type="radio" name="attendance" value="no" required>
                        <span class="choice-icon" aria-hidden="true">♡</span>
                        <span>К сожалению, не получится</span>
                    </label>
                </fieldset>

                </div>

    <script>
        // Когда блок попадает в экран, добавляем ему класс in-view, и CSS запускает анимации
        const targets = document.querySelectorAll('.garland-container, .photos-container, .love-section');

        if ('IntersectionObserver' in window) {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('in-view');
                        observer.unobserve(entry.target);   // срабатывает один раз
                    }
                });
            }, {
                threshold: 0.2,                             // блок виден минимум на 20%
                rootMargin: '0px 0px -8% 0px'               // чуть позже нижнего края экрана
            });

            targets.forEach((el) => observer.observe(el));
        } else {
            // Старые браузеры: показываем всё сразу
            targets.forEach((el) => el.classList.add('in-view'));
        }


        // Галерея: фото открываются по клику, Enter или пробелу.
        const photoWrappers = Array.from(document.querySelectorAll('.photo-wrapper'));
        const lightbox = document.getElementById('photo-lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const lightboxCaption = document.getElementById('lightbox-caption');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const lightboxClose = lightbox.querySelector('.lightbox-close');
        const lightboxPrev = lightbox.querySelector('.lightbox-prev');
        const lightboxNext = lightbox.querySelector('.lightbox-next');
        const galleryPhotos = photoWrappers.map((wrapper) => {
            const img = wrapper.querySelector('img');
            wrapper.tabIndex = 0;
            wrapper.setAttribute('role', 'button');
            wrapper.setAttribute('aria-label', `Открыть фото: ${img.alt || 'Фотография'}`);
            return { src: img.currentSrc || img.src, alt: img.alt || 'Фотография' };
        });
        let activePhotoIndex = 0;
        let lastPhotoTrigger = null;

        function renderPhoto(index) {
            activePhotoIndex = (index + galleryPhotos.length) % galleryPhotos.length;
            const photo = galleryPhotos[activePhotoIndex];
            lightboxImage.src = photo.src;
            lightboxImage.alt = photo.alt;
            lightboxCaption.textContent = photo.alt;
            lightboxCounter.textContent = `${activePhotoIndex + 1} из ${galleryPhotos.length}`;
        }

        function openPhoto(index, trigger) {
            if (!galleryPhotos.length) return;
            lastPhotoTrigger = trigger;
            renderPhoto(index);
            lightbox.hidden = false;
            document.body.classList.add('lightbox-open');
            lightboxClose.focus();
        }

        function closePhoto() {
            lightbox.hidden = true;
            document.body.classList.remove('lightbox-open');
            if (lastPhotoTrigger) lastPhotoTrigger.focus();
        }

        photoWrappers.forEach((wrapper, index) => {
            wrapper.addEventListener('click', () => openPhoto(index, wrapper));
            wrapper.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    openPhoto(index, wrapper);
                }
            });
        });
        lightboxClose.addEventListener('click', closePhoto);
        lightboxPrev.addEventListener('click', () => renderPhoto(activePhotoIndex - 1));
        lightboxNext.addEventListener('click', () => renderPhoto(activePhotoIndex + 1));
        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) closePhoto();
        });
        document.addEventListener('keydown', (event) => {
            if (lightbox.hidden) return;
            if (event.key === 'Escape') closePhoto();
            if (event.key === 'ArrowLeft') renderPhoto(activePhotoIndex - 1);
            if (event.key === 'ArrowRight') renderPhoto(activePhotoIndex + 1);
            if (event.key === 'Tab') {
                const focusable = [lightboxClose, lightboxPrev, lightboxNext];
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (event.shiftKey && document.activeElement === first) {
                    event.preventDefault(); last.focus();
                } else if (!event.shiftKey && document.activeElement === last) {
                    event.preventDefault(); first.focus();
                }
            }
        });

        // RSVP отправляет ответ на сервер сайта, а сервер безопасно пересылает его Telegram-ботом.
        // Токен Telegram никогда не хранится в браузере.
        const rsvpForm = document.getElementById('rsvp-form');
        const guestCountField = document.getElementById('guest-count-field');
        const guestCountSelect = document.getElementById('guest-count');
        const rsvpResult = document.getElementById('rsvp-result');
        const rsvpMessage = document.getElementById('rsvp-message');
        const rsvpStatus = document.getElementById('rsvp-status');
        const copyResponseButton = document.getElementById('copy-response');
        const rsvpSubmitButton = document.getElementById('rsvp-submit');

        rsvpForm.querySelectorAll('input[name="attendance"]').forEach((input) => {
            input.addEventListener('change', () => {
                const willAttend = rsvpForm.querySelector('input[name="attendance"]:checked')?.value === 'yes';
                guestCountField.hidden = !willAttend;
                guestCountSelect.disabled = !willAttend;
            });
        });

        rsvpForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            if (!rsvpForm.reportValidity()) return;

            const data = new FormData(rsvpForm);
            const guestName = String(data.get('guestName') || '').trim();
            const attendance = String(data.get('attendance') || '');
            const note = String(data.get('note') || '').trim();
            const guestCount = attendance === 'yes' ? Number(data.get('guestCount') || 1) : null;
            const lines = [
                `Привет! Это ${guestName}.`,
                attendance === 'yes'
                    ? `С радостью приду на свадьбу Дарьи и Никиты. Нас будет: ${guestCount}.`
                    : 'К сожалению, не смогу присутствовать на свадьбе Дарьи и Никиты.'
            ];
            if (note) lines.push(`Сообщение: ${note}`);
            rsvpMessage.value = lines.join('\n');
            rsvpResult.hidden = false;
            rsvpSubmitButton.disabled = true;
            rsvpSubmitButton.textContent = 'Отправляем…';
            rsvpStatus.textContent = 'Отправляем ответ организаторам…';

            try {
                const response = await fetch('/api/rsvp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ guestName, attendance, guestCount, note })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(result.error || 'Не удалось отправить ответ.');
                rsvpStatus.textContent = 'Спасибо! Ответ успешно отправлен организаторам в Telegram.';
                rsvpResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } catch (error) {
                rsvpStatus.textContent = 'Не удалось отправить ответ в Telegram. Текст остался ниже — скопируй его и отправь организаторам вручную.';
                rsvpResult.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            } finally {
                rsvpSubmitButton.disabled = false;
                rsvpSubmitButton.textContent = 'Отправить ответ';
            }
        });

        async function copyRsvpText() {
            const textToCopy = rsvpMessage.value;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(textToCopy);
                } else {
                    rsvpMessage.focus();
                    rsvpMessage.select();
                    const copied = document.execCommand('copy');
                    if (!copied) throw new Error('Копирование недоступно');
                    window.getSelection()?.removeAllRanges();
                }
                rsvpStatus.textContent = 'Текст ответа скопирован.';
            } catch (error) {
                rsvpMessage.focus();
                rsvpMessage.select();
                rsvpStatus.textContent = 'Не удалось скопировать автоматически — выдели текст выше и скопируй вручную.';
            }
        }
        copyResponseButton.addEventListener('click', copyRsvpText);

    </script>
</body>
</html>
